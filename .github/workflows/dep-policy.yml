name: dep-policy
on:
  pull_request:
  push:
    branches: [main]
jobs:
  dep-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: dependency policy (L-076)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=""
          python3 scripts/ci/test_dep_policy_check.py
          python3 scripts/ci/dep_policy_check.py ${BASE:+--base "$BASE"}
